
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DealDine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <p class="smallmuted">Your Favorites</p>
        <p class="muted">Select up to 10 chains to personalize your feed.</p>
        <div id="chipContainer" class="chips"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="brand">
          <div class="logo"><img src="images/icon.png" alt="DealDine" width="28" height="28"/></div>
          <div>
            <h1 class="title">DealDine</h1>
            <p class="subtitle">Your daily feed of fast food deals.</p>
          </div>
        </div>
        <div class="sort">
          <button class="pill active" data-sort="relevance">Relevance</button>
          <button class="pill" data-sort="savings">Savings</button>
          <button class="pill" data-sort="expiration">Expiration</button>
        </div>
      </header>

      <section class="section">
        <h2>Your Deals</h2>
        <div id="grid" class="grid"></div>
      </section>
    </main>
  </div>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-img">
        <img class="img" alt="deal image"/>
      </div>
      <div class="card-body">
        <div class="meta">
          <img class="chain-logo" alt="logo" width="18" height="18"/>
          <span class="chain"></span>
        </div>
        <h3 class="card-title"></h3>
        <div class="badge-row">
          <span class="badge"></span>
        </div>
        <div class="expiry">
          <span class="cal">📅</span>
          <span class="expires"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js" type="module"></script>
</body>
</html>
